---
plugins:
- rubocop-performance
- rubocop-rake
- rubocop-rspec
AllCops:
  DisplayCopNames: true
  NewCops: enable
  TargetRubyVersion: '2.7'
  Include:
  - "**/*.rb"
  Exclude:
  - bin/*
  - ".vendor/**/*"
  - "**/Gemfile"
  - "**/Rakefile"
  - pkg/**/*
  - spec/fixtures/**/*
  - vendor/**/*
  - "**/Puppetfile"
  - "**/Vagrantfile"
  - "**/Guardfile"
  - ext/**/*
Layout/EmptyLinesAroundAttributeAccessor:
  Enabled: true
Layout/LineLength:
  Description: People have wide screens, use them.
  Max: 200
  AllowedPatterns:
  # embedded GRUB password hashes in test data
  - grub\.pbkdf2\.sha512
  # generated single-line puppet apply commands in test expectations
  - 'network::eth\{'
Layout/SpaceAroundMethodCallOperator:
  Enabled: true
Lint/RaiseException:
  Enabled: true
Lint/StructNewOverride:
  Enabled: false
RSpec/BeforeAfterAll:
  Description: Beware of using after(:all) as it may cause state to leak between tests.
    A necessary evil in acceptance testing.
  Exclude:
  - spec/acceptance/**/*.rb
  - spec/lib/**/*.rb
RSpec/ExpectInHook:
  Description: Message expectations in before hooks are an established
    pattern in these specs.
  Enabled: false
RSpec/HookArgument:
  Description: Prefer explicit :each argument, matching existing module's style
  EnforcedStyle: each
RSpec/NamedSubject:
  Exclude:
  - spec/classes/**/*
  - spec/defines/**/*
  - spec/lib/**/*
Style/BlockDelimiters:
  Description: Prefer braces for chaining. Mostly an aesthetical choice. Better to
    be consistent then.
  EnforcedStyle: braces_for_chaining
Style/ClassAndModuleChildren:
  Enabled: false
Style/EmptyElse:
  Description: Enforce against empty else clauses, but allow `nil` for clarity.
  EnforcedStyle: empty
Style/ExponentialNotation:
  Enabled: true
Style/FormatString:
  Description: Following the main puppet project's style, prefer the % format format.
  EnforcedStyle: percent
Style/FormatStringToken:
  Description: Following the main puppet project's style, prefer the simpler template
    tokens over annotated ones.
  EnforcedStyle: template
Style/HashEachMethods:
  Enabled: true
Style/HashSyntax:
  Enabled: false
Style/HashTransformKeys:
  Enabled: false
Style/HashTransformValues:
  Enabled: true
Style/Lambda:
  Description: Prefer the keyword for easier discoverability.
  EnforcedStyle: literal
Style/RedundantBegin:
  Enabled: false
Style/RegexpLiteral:
  Description: Community preference. See https://github.com/voxpupuli/modulesync_config/issues/168
  EnforcedStyle: percent_r
Style/TernaryParentheses:
  Description: Checks for use of parentheses around ternary conditions. Enforce parentheses
    on complex expressions for better readability, but seriously consider breaking
    it up.
  EnforcedStyle: require_parentheses_when_complex
Style/TrailingCommaInArguments:
  Description: Prefer always trailing comma on multiline argument lists. This makes
    diffs, and re-ordering nicer.
  EnforcedStyleForMultiline: comma
Style/TrailingCommaInArrayLiteral:
  Description: Prefer always trailing comma on multiline literals. This makes diffs,
    and re-ordering nicer.
  EnforcedStyleForMultiline: comma
Style/SlicingWithRange:
  Enabled: true
Style/SymbolArray:
  Description: Using percent style obscures symbolic intent of array's contents.
  EnforcedStyle: brackets
RSpec/MessageSpies:
  Description: The specs mix expect-to-receive and spy styles extensively;
    converging on one style is not worth the churn.
  Enabled: false
Style/WordArray:
  EnforcedStyle: brackets
Style/CollectionMethods:
  Enabled: true
Style/MethodCalledOnDoEndBlock:
  Enabled: true
Style/StringMethods:
  Enabled: true
Layout/EndOfLine:
  Enabled: false
Layout/HeredocIndentation:
  Enabled: false
Metrics/AbcSize:
  Enabled: false
Metrics/BlockLength:
  Enabled: false
Metrics/ClassLength:
  Enabled: false
Metrics/CyclomaticComplexity:
  Enabled: false
Metrics/MethodLength:
  Enabled: false
Metrics/ModuleLength:
  Enabled: false
Metrics/ParameterLists:
  Enabled: false
Metrics/PerceivedComplexity:
  Enabled: false
RSpec/DescribeClass:
  Enabled: false
RSpec/ExampleLength:
  Enabled: false
RSpec/MessageExpectation:
  Enabled: false
RSpec/MultipleExpectations:
  Enabled: false
RSpec/MultipleMemoizedHelpers:
  Enabled: false
RSpec/NestedGroups:
  Enabled: false
Style/AsciiComments:
  Enabled: false
Style/ClassVars:
  Enabled: false
Style/Documentation:
  Enabled: false
Style/GlobalVars:
  Enabled: false
Style/IfUnlessModifier:
  Enabled: false
Style/OptionalBooleanParameter:
  Enabled: false
Style/SymbolProc:
  Enabled: false
Lint/DuplicateBranch:
  Enabled: false
Lint/DuplicateMethods:
  Enabled: false
Lint/MissingSuper:
  Enabled: false
Lint/MixedRegexpCaptureTypes:
  Enabled: false
Lint/NestedMethodDefinition:
  Enabled: false
Lint/RescueException:
  Enabled: false
Lint/SuppressedException:
  Enabled: false
Lint/UnderscorePrefixedVariableName:
  Enabled: false
Metrics/BlockNesting:
  Enabled: false
Naming/AccessorMethodName:
  Enabled: false
Naming/HeredocDelimiterNaming:
  Enabled: false
Naming/MethodParameterName:
  Enabled: false
Naming/PredicateMethod:
  Enabled: false
Naming/PredicatePrefix:
  Enabled: false
Performance/CollectionLiteralInLoop:
  Enabled: false
RSpec/ContextWording:
  Enabled: false
RSpec/ExpectActual:
  Enabled: false
RSpec/InstanceVariable:
  Enabled: false
RSpec/LeakyConstantDeclaration:
  Enabled: false
RSpec/LeakyLocalVariable:
  Enabled: false
RSpec/LetSetup:
  Enabled: false
RSpec/MultipleDescribes:
  Enabled: false
RSpec/NoExpectationExample:
  Enabled: false
RSpec/SpecFilePathFormat:
  Enabled: false
RSpec/StubbedMock:
  Enabled: false
Style/FileOpen:
  Enabled: false
Style/MixinUsage:
  Enabled: false
Style/MultilineBlockChain:
  Enabled: false
Style/OneClassPerFile:
  Enabled: false
Style/StringConcatenation:
  Enabled: false
Lint/ConstantDefinitionInBlock:
  Enabled: false
RSpec/Output:
  Description: The CLI specs intentionally print captured console output for
    test diagnostics, and spec helper classes implement real option parsers.
  Enabled: false
RSpec/VerifiedDoubleReference:
  Description: object_double doubles here use descriptive strings on purpose;
    the cop's autocorrection mangles them into invalid constant references.
  Enabled: false
Style/BitwisePredicate:
  Description: This codebase uses & for Array set intersection; the cop
    misidentifies those comparisons as integer bit tests and its
    autocorrection (allbits?) raises NoMethodError on Arrays.
  Enabled: false
Lint/EmptyClass:
  Description: Empty module/class declarations (e.g. `module Simp; end`) are
    used throughout as namespace forward declarations.
  Enabled: false
RSpec/SubjectStub:
  Description: The command/item specs stub methods on the object under test
    extensively; reworking them is out of scope for style cleanup.
  Enabled: false
Security/YAMLLoad:
  Description: On Ruby >= 3.1 (Psych 4), YAML.load already uses safe-load
    semantics. The YAML files loaded here are local, trusted configuration.
  Enabled: false
RSpec/IncludeExamples:
  Description: include_examples splices shared examples in place, while
    it_behaves_like nests them in a child group that runs after the parent
    group's own examples. The acceptance suites rely on in-place ordering
    (e.g. the beaker ssh-session workaround must run before its siblings),
    so the conversion changes execution order and breaks them.
  Enabled: false
